# HumanVerse XOS — akar workspace Python (uv).
#
# Akar ini VIRTUAL: ia tidak memaketkan apa pun. Ia hanya memegang anggota
# workspace, dependensi pengembangan, dan konfigurasi perkakas — supaya satu
# `uv sync` menyiapkan seluruh lingkungan dan satu `uv.lock` mengunci semuanya.
#
# Anggota V0 hanya satu: `apps/api` (spec/06 — satu proses, satu deploy).

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
hvx-api = { workspace = true }

[dependency-groups]
dev = [
  "hvx-api",
  # uji — spec/07 0.6
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  # lint & tipe — spec/07 0.7
  "ruff>=0.6",
  "mypy>=1.11",
  # batas modul & batas keras — spec/07 0.8
  "import-linter>=2.1",
  # pindai — spec/07 0.7
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[tool.uv]
default-groups = ["dev"]
