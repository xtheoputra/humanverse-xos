# HumanVerse XOS — akar workspace Python (uv).
#
# Akar ini VIRTUAL: ia tidak memaketkan apa pun. Ia hanya memegang anggota
# workspace, dependensi pengembangan, dan konfigurasi perkakas — supaya satu
# `uv sync` menyiapkan seluruh lingkungan dan satu `uv.lock` mengunci semuanya.
#
# Anggota V0 hanya satu: `apps/api` (spec/06 — satu proses, satu deploy).

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
hvx-api = { workspace = true }

[dependency-groups]
dev = [
  "hvx-api",
  # uji — spec/07 0.6
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  # lint & tipe — spec/07 0.7
  "ruff>=0.6",
  "mypy>=1.11",
  # batas modul & batas keras — spec/07 0.8
  "import-linter>=2.1",
  # pindai — spec/07 0.7
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[tool.uv]
default-groups = ["dev"]

# ───────────────────────────────────────────────────────────── ruff ──

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "tests", "tools", "data/migrations"]
extend-exclude = ["docs", "spec", "arch"]

[tool.ruff.format]
# Dua perkakas dokumen ini mendahului kode produksi dan punya gaya sendiri;
# memformat ulang keduanya hanya menambah diff tanpa mengubah perilaku.
exclude = ["tools/periksa_dokumen.py", "tools/uji_mutasi.py"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "S",            # bandit (lapisan pertama; `bandit` penuh di tahap scan)
  "ASYNC",        # kesalahan async
  "PT",           # gaya pytest
  "SIM",
  "RUF",
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # teks Bahasa Indonesia memakai tanda baca Unicode dengan sengaja
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # assert & kredensial palsu di uji
"tools/**" = ["S603", "S607", "E501"]  # perkakas memanggil subprocess; laporan berbaris panjang

# ───────────────────────────────────────────────────────────── mypy ──

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src"
packages = ["hvx"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────── pytest ──

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
  "integration: butuh PostgreSQL & Redis sungguhan (HVX_TEST_DATABASE_URL, HVX_TEST_REDIS_URL) — GAGAL, bukan dilewati, kalau tidak tersedia",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["hvx"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

# ─────────────────────────────────────────────────────────── bandit ──

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
