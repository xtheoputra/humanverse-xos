name: periksa-dokumen

# Menjalankan pemeriksaan `arch/11` yang membaca dokumen, DDL, dan pohon
# direktori — tanpa dependensi, untuk perubahan yang HANYA menyentuh dokumen.
# CI kode adalah `ci.yml` (spec/07 tugas 0.7), yang tahap `lint`-nya juga
# menjalankan pemeriksaan yang sama.
#
# 🔑 Alur ini ada supaya aturan repo berhenti menjadi sesuatu yang harus
#    DIINGAT seseorang. Sebuah skrip yang bisa dijalankan tetapi tidak
#    pernah dijalankan masih aturan tanpa penjaga — persis pola yang
#    `arch/11` §1 daftar enam kali.
#
# ⚠️ R-1 GAGAL hari ini, dan itu benar: enam roadmap fase menjadwalkan
#    gerbang sesudah hal yang dijaganya (#99 #111 #116 #121 #131 #144).
#    Mengurutkannya ulang adalah keputusan CAKUPAN, milik pemilik. Karena
#    itu R-1 dijalankan terpisah dan TIDAK menggagalkan alur — ia
#    melaporkan. Yang menggagalkan alur adalah empat belas pemeriksaan lain,
#    yang keempat belasnya hijau dan harus tetap hijau.
#
# 🔑 Langkah uji mutasi ada supaya "empat belas hijau" tidak bisa berarti
#    "pemeriksaan yang tidak melihat apa pun": ia merusak satu
#    hal yang tiap pemeriksaan KLAIM deteksi dan menuntut merahnya.

on:
  push:
    paths: ['docs/**', 'spec/**', 'arch/**', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: ['docs/**', 'spec/**', 'arch/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Daftar kode WAJIB dibaca dari tools/ci_lokal.py — bukan disalin ke sini,
      # supaya kedua gerbang tidak bisa menyimpang.
      - name: Pemeriksaan dokumen wajib — sama persis dengan tahap lint ci_lokal
        run: >
          python tools/periksa_dokumen.py
          $(python -c "import sys; sys.path.insert(0, 'tools'); import ci_lokal; print(' '.join(ci_lokal.PERIKSA_WAJIB))")

      - name: Uji mutasi — buktikan tiap pemeriksaan sanggup GAGAL
        run: python tools/uji_mutasi.py

      - name: R-1 — dilaporkan, tidak menggagalkan (keputusan cakupan pemilik)
        if: always()
        run: python tools/periksa_dokumen.py R-1 || true
