# Analisis statis aplikasi V0 — dijalankan gerbang `tools/ci_lokal.py`
# (`flutter analyze --fatal-infos`): peringatan sekecil apa pun menggagalkannya,
# sama dengan ruff/mypy --strict di sisi api.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
