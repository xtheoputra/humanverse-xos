name: habit.complete
version: 1.0.0
kind: write
description: Catat penyelesaian habit pada satu tanggal (POST /habits/{id}/completions)
scopes: [habits]
risk_level: 2               # aksi reversibel — izin diminta sekali, lalu boleh diingat
input:
  habit_id: { type: uuid, required: true }
  for_date: { type: date, required: true }
  status: { type: string, required: true, enum: [done, skipped, partial] }
  tier_used: { type: integer, required: false, min: 0 }
output:
  id: uuid
  status: string
side_effects: writes_user_data
reaches_third_party: false
rate_limit: 20/min/user
