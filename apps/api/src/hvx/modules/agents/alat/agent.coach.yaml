# K-14 — memanggil agent lain ADALAH pemanggilan tool; risk_level = max_risk agent itu.
name: agent.coach
version: 1.0.0
kind: agent
description: Serahkan permintaan kepada coach-agent
scopes: [habits, goals, checkins, mood, coaching_notes]
risk_level: 1
input:
  pesan: { type: string, required: true }
output:
  teks: string
  confidence: number
  rationale: { type: array, items: string }
side_effects: writes_user_data
reaches_third_party: false
rate_limit: 30/min/user
