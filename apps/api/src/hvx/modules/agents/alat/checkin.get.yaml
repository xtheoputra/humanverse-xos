name: checkin.get
version: 1.0.0
kind: read
description: Check-in harian pada satu tanggal — energi, fokus, jam tidur (tanpa catatan)
scopes: [checkins]
risk_level: 0
input:
  for_date: { type: date, required: true }
output:                     # tanpa `note` — tulisan pengguna bukan bahan coach (C-32)
  checkin:
    type: object | null
    fields:
      for_date: string
      energy: integer | null
      focus: integer | null
      sleep_hours: number | null
side_effects: none
reaches_third_party: false
rate_limit: 60/min/user
