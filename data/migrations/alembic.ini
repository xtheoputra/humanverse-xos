# Alembic — migrasi PostgreSQL HumanVerse XOS (spec/07 tugas 0.4).
#
#   alembic -c data/migrations/alembic.ini upgrade head
#   alembic -c data/migrations/alembic.ini downgrade base
#
# URL basis data TIDAK ditulis di sini (arch/09 §5 aturan 3): env.py membacanya
# dari HVX_DATABASE_URL.

[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os
file_template = %%(rev)s_%%(slug)s
